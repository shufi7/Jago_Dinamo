<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda Admin - JagoDinamoId</title>
    <link rel="stylesheet" href="/komponen/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/komponen/style/main/admin.css"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- LINK BARU KE HOMEADMIN.CSS -->
    <link rel="stylesheet" href="/komponen/style/main/homeadmin.css"> 
</head>

<body>
    <nav class="navbar navbar-expand-lg custom-navbar fixed-top navbar-utama navbar-dark">
        <div class="container-fluid d-flex justify-content-between">
            <a class="navbar-brand d-flex align-items-center text-white" href="home.html">
                <img src="/komponen/image/white logo.png" alt="Logo" class="me-2 logo-navbar" />
                <span class="ms-2">Admin Panel</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavAdmin">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNavAdmin">
                <ul class="navbar-nav ms-auto text-end">
                    <li class="nav-item">
                        <a class="nav-link me-lg-4 button-text text-white" href="loginadmin.html">Log Out</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="wrapper-admin">
        <nav class="sidebar-admin">
            <div class="d-flex flex-column h-100">
                <h5 class="mb-4 text-center">Menu Admin</h5>
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="homeadmin.html" class="nav-link active">
                            <i class="bi bi-house-door-fill"></i> Beranda
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="admin.html" class="nav-link">
                            <i class="bi bi-clipboard-check"></i> Pesanan Baru
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="adminprogres.html" class="nav-link">
                            <i class="bi bi-hourglass-split"></i> Progres Perbaikan
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="keuangan.html" class="nav-link">
                            <i class="bi bi-cash-stack"></i> Keuangan
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="content-admin">
            <div class="container-fluid">
                <h1 class="text-white mb-4">Dashboard Admin</h1>

                <!-- Dashboard Keuangan -->
                <div class="row mb-5">
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card dashboard-card">
                            <div class="card-body">
                                <h5 class="card-title text-success">Total Pendapatan (Bulan Ini)</h5>
                                <p class="card-text display-5 text-white" id="totalRevenueMonth">Rp 0</p>
                                <button class="btn btn-sm btn-outline-danger mt-2" id="resetMonthRevenue">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card dashboard-card">
                            <div class="card-body">
                                <h5 class="card-title text-info">Penghasilan Kotor</h5>
                                <p class="card-text display-5 text-white" id="grossRevenue">Rp 0</p>
                                <button class="btn btn-sm btn-outline-danger mt-2" id="resetGrossRevenue">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card dashboard-card">
                            <div class="card-body">
                                <h5 class="card-title text-warning">Penghasilan Bersih</h5>
                                <p class="card-text display-5 text-white" id="netRevenue">Rp 0</p>
                                <button class="btn btn-sm btn-outline-danger mt-2" id="resetNetRevenue">Reset</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabel Barang Digunakan -->
                <div class="row">
                    <div class="col-12">
                        <div class="card dashboard-card">
                            <div class="card-body">
                                <h5 class="card-title text-primary">Barang Digunakan (Stok Terpakai)</h5>
                                <div class="table-responsive">
                                    <table class="table table-dark table-striped table-bordered mt-3">
                                        <thead>
                                            <tr>
                                                <th>Nama Barang</th>
                                                <th>Jumlah Terpakai</th>
                                            </tr>
                                        </thead>
                                        <tbody id="usedItemsTableBody">
                                            <tr><td colspan="2" class="text-center">Belum ada barang terpakai.</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                                <button class="btn btn-sm btn-outline-danger mt-2" id="resetUsedItems">Reset Barang</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- TOAST CONTAINER (untuk notifikasi) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Script Bootstrap & JS -->
    <script src="/komponen/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/komponen/script/homeadmin.js" type="module"></script> <!-- Link JS baru -->
    <script>
        // Script untuk navbar fixed dan shadow (akan dihapus dari sini dan dipindahkan ke admin.css atau homeadmin.css)
        window.addEventListener("scroll", function () {
            const navbar = document.querySelector(".navbar");
            if (window.scrollY > 50) {
                navbar.classList.add("shadow");
                navbar.style.backgroundColor = '#0A0F2C';
            } else {
                navbar.classList.remove("shadow");
                navbar.style.backgroundColor = 'transparent';
            }
        });
    </script>
</body>
</html>
